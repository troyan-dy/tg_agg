# flake8 не читает pyproject.toml, поэтому конфиг здесь.
# flake8 используется только как раннер wemake-python-styleguide (WPS);
# базовый линт (pyflakes/pycodestyle/isort/…) остаётся за ruff.
[flake8]
select = WPS
max-line-length = 100
exclude = .git,.venv,__pycache__,.mypy_cache,.pytest_cache,.ruff_cache,migrations,deploy

per-file-ignores =
    # aiogram-роутер: все хендлеры бота регистрируются на одном Router в одном модуле
    # (WPS201/202), охранные `channel is None` / `_require_channel(message)` /
    # `channel_kb(channel)` повторяются в каждом хендлере по смыслу (WPS204),
    # `F` — канонический импорт magic filter из aiogram (WPS347).
    app/bot/handlers.py: WPS201, WPS202, WPS204, WPS347
    # Методы get_state/set_state/get_data/set_data — интерфейс aiogram BaseStorage.
    app/bot/fsm_storage.py: WPS615
    # Точка входа связывает все подсистемы: импорты и мелкие функции запуска.
    app/main.py: WPS201, WPS202
    # Плоские модули из небольших функций (шаги пайплайна, разбор RSS, по функции
    # на операцию с БД) — дробление на модули/классы ничего не даёт.
    app/pipeline.py: WPS202
    app/services/rss.py: WPS202
    app/storage.py: WPS202
    # Таблица пресетов: температура — данные пресета, а не «магическое» число.
    app/tone.py: WPS432
    # Тесты: литералы и числа в фикстурах/ассертах, длинные описательные имена,
    # фейковые классы/функции внутри тестов, много ассертов и await в сценарии.
    tests/*.py: WPS118, WPS202, WPS204, WPS210, WPS217, WPS218, WPS219, WPS226, WPS430, WPS431, WPS432
